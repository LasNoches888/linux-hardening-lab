#!/usr/sbin/nft -f
# Базовый файрвол для одиночного сервера: всё входящее запрещено, кроме SSH и ответов на исходящие соединения.
#
# Применение (ВАЖНО: держите открытой вторую SSH-сессию — ошибка в правилах может закрыть доступ):
#   sudo nft -c -f nftables_baseline.conf     # только проверка синтаксиса
#   sudo nft -f nftables_baseline.conf
# Откат: sudo nft flush ruleset

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    ct state invalid drop
    ct state established,related accept
    iif "lo" accept

    # ICMP/ICMPv6 нужны для работы сети (в т.ч. IPv6 neighbor discovery), лимитируем echo
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    ip protocol icmp icmp type { destination-unreachable, time-exceeded } accept
    meta l4proto ipv6-icmp accept

    # SSH с ограничением частоты новых соединений
    tcp dport 22 ct state new limit rate 10/minute accept

    # Журналировать остальное (с лимитом, чтобы не забить лог)
    limit rate 5/minute log prefix "nft-drop: " level info
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
