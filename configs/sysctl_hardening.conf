# Усиление сетевого стека и ядра (учебный пример).
# Установка:  sudo cp sysctl_hardening.conf /etc/sysctl.d/99-hardening.conf && sudo sysctl --system
# Откат:      sudo rm /etc/sysctl.d/99-hardening.conf && sudo sysctl --system  (или перезагрузка)
#
# Перед применением на рабочем сервере проверьте каждый параметр: например, ip_forward=0
# сломает маршрутизатор/NAT/Docker-хост.

# --- Защита от подмены адресов и перенаправлений ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# --- Устойчивость к SYN-флуду и ICMP-злоупотреблениям ---
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Журналирование «марсианских» пакетов ---
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# --- Ядро ---
# Скрывать адреса ядра от непривилегированных пользователей
kernel.kptr_restrict = 2
# Ограничить чтение dmesg
kernel.dmesg_restrict = 1
# Запретить ptrace чужих процессов (защита от дампа памяти соседних процессов)
kernel.yama.ptrace_scope = 1
# Защита от атак через жёсткие/символические ссылки в общих каталогах
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# Не создавать core-дампы для setuid-программ
fs.suid_dumpable = 0
# ASLR на полную
kernel.randomize_va_space = 2
